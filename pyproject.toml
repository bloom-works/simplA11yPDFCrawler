[project]
name = "simpla11ypdf"
version = "2.1.0"
description = "PDF accessibility crawler and scanner"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "accessibility-luxembourg" },
  { name = "Bloom Works" }
]
keywords = ["pdf", "accessibility", "wcag"]

dependencies = [
  "scrapy>=2.15,<3.0",
  "pikepdf>=10.5,<11.0",
  "langcodes>=3.5,<4.0",
  "bitstring>=4.4,<5.0",
  "dateparser>=1.4,<2.0",
  "pytz>=2026.2,<2027.0",
  "typer>=0.25,<1.0",
]

[project.urls]
Homepage = "https://github.com/bloom-works/simplA11yPDFCrawler"
Repository = "https://github.com/bloom-works/simplA11yPDFCrawler"
Issues = "https://github.com/bloom-works/simplA11yPDFCrawler/issues"

[project.scripts]
simpla11ypdf = "simpla11ypdf.cli:main"

[tool.poetry]
packages = [{ include = "simpla11ypdf" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"